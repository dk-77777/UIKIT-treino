<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStart | UIkit</title>

    <!-- 1. Importando o CSS do UIkit -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3/dist/css/uikit.min.css">
</head>
<body>

    <!-- 2. Menu de navegação -->
    <nav class="uk-navbar-container">
        <div class="uk-container">
            <div uk-navbar>
                <div class="uk-navbar-left">
                    <a class="uk-navbar-item uk-logo" href="#inicio">TechStart</a>
                </div>
                <div class="uk-navbar-right">
                    <ul class="uk-navbar-nav">
                        <li><a href="#inicio">Início</a></li>
                        <li><a href="#servicos">Serviços</a></li>
                        <li><a href="#contato">Contato</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- 3. Apresentação principal -->
    <section id="inicio" class="uk-section uk-section-primary uk-text-center">
        <div class="uk-container">
            <h1>Bem-vindo à TechStart</h1>
            <p class="uk-text-lead">Criamos soluções digitais para suas ideias.</p>
            <a class="uk-button uk-button-default" href="#servicos">Conhecer serviços</a>
        </div>
    </section>

    

    <!-- 8. JavaScript do UIkit para componentes interativos -->
    <script src="https://cdn.jsdelivr.net/npm/uikit@3/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3/dist/js/uikit-icons.min.js"></script>
